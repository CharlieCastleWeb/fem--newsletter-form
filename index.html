<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>
  </head>
  <body>
    <section class="newsletter">
      <picture>
        <source
          srcset="./public/images/illustration-sign-up-desktop.svg"
          media="(min-width: 880px)"
        />
        <img
          src="./public/images/illustration-sign-up-mobile.svg"
          alt="App mockup"
          class="newsletter__image"
        />
      </picture>

      <div class="newsletter__content">
        <h1 class="newsletter__title">Stay updated!</h1>
        <p class="newsletter__description">
          Join 60,000+ product managers receiving monthly updates on:
        </p>
        <ul class="newsletter__list">
          <li class="newsletter__list-item">
            Product discovery and building what matters
          </li>
          <li class="newsletter__list-item">
            Measuring to ensure updates are a success
          </li>
          <li class="newsletter__list-item">And much more!</li>
        </ul>
        <div>
          <form class="newsletter__form">
            <div class="newsletter__field-info">
              <label for="email" class="newsletter__label">Email address</label>
              <span class="newsletter__error-message hidden"
                >Valid email required</span
              >
            </div>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="email@company.com"
              class="newsletter__input"
              required
            />
            <button type="submit" class="newsletter__button btn-primary">
              Subscribe to monthly newsletter
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- Thanks for subscribing! A confirmation email has been sent to
    ash@loremcompany.com. Please open it and click the button inside to confirm
    your subscription. Dismiss message -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
